{% extends "base.html" %}
{% block title %}变形 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">表达式变形</div>
    <div class="form-group">
        <label>表达式</label>
        <input type="text" id="expr" placeholder="如 (x+1)**2">
    </div>
    <div class="form-group">
        <label>变形方法</label>
        <select id="method" onchange="onMethodChange()">
            <option value="0">通用化简(simplify)</option>
            <option value="1">展开(expand)</option>
            <option value="2">因式分解(factor)</option>
            <option value="3">主元(collect)</option>
            <option value="4">通分(cancel)</option>
            <option value="5">分离(apart)</option>
            <option value="6">三角变换(trigsimp)</option>
            <option value="7">三角展开(expand_trig)</option>
            <option value="8">指数合并(powsimp)</option>
            <option value="9">指数展开(expand_power_exp)</option>
            <option value="10">对数展开(expand_log)</option>
            <option value="11">对数合并(logcombine)</option>
            <option value="12">换元</option>
        </select>
    </div>
    <div class="form-row">
        <div class="form-group" id="zhuyuan_group" style="display:none">
            <label>主元符号</label>
            <input type="text" id="zhuyuan" value="x">
        </div>
        <div class="form-group" id="huanyuan_group" style="display:none">
            <label>换元符号</label>
            <input type="text" id="huanyuan" value="t">
        </div>
        <div class="form-group" id="huanyuanshi_group" style="display:none">
            <label>换元式</label>
            <input type="text" id="huanyuanshi" placeholder="如 x = t**2">
        </div>
    </div>
    <button class="btn" onclick="doTransform()">变形</button>

    <div class="result-label" style="margin-top:1rem">变形结果</div>
    <div class="result-box" id="result"></div>
    <div class="result-text" id="result_text"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
function onMethodChange() {
    const m = document.getElementById('method').value;
    document.getElementById('zhuyuan_group').style.display = (m == 3 || m == 12) ? 'block' : 'none';
    document.getElementById('huanyuan_group').style.display = (m == 12) ? 'block' : 'none';
    document.getElementById('huanyuanshi_group').style.display = (m == 12) ? 'block' : 'none';
}

async function doTransform() {
    const data = {
        expr: document.getElementById('expr').value,
        method: document.getElementById('method').value,
        zhuyuan: document.getElementById('zhuyuan').value,
        huanyuan: document.getElementById('huanyuan').value,
        huanyuanshi: document.getElementById('huanyuanshi').value
    };
    const r = await apiCall('/api/bianxing', data);
    if (r.ok) {
        renderMath('result', r.latex);
        showText('result_text', r.text);
    } else {
        showError('result', r.error);
    }
}
</script>
{% endblock %}
