{% extends "base.html" %}
{% block title %}求导 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">求导</div>
    <div class="form-group">
        <label>原函数表达式</label>
        <input type="text" id="expr" placeholder="如 x**3 + 2*x">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>自变量</label>
            <input type="text" id="var" value="x">
        </div>
        <div class="form-group">
            <label>求导次数</label>
            <input type="text" id="n" value="1">
        </div>
    </div>
    <div class="checkbox-group" style="margin-bottom:1rem">
        <label><input type="checkbox" id="is_yin"> 隐函数求导</label>
        <label><input type="checkbox" id="is_xval"> 求具体值</label>
    </div>
    <div class="form-row" id="yin_row" style="display:none">
        <div class="form-group">
            <label>因变量</label>
            <input type="text" id="yin_var" value="y">
        </div>
    </div>
    <div class="form-row" id="xval_row" style="display:none">
        <div class="form-group">
            <label>自变量的值</label>
            <input type="text" id="x_val" placeholder="如 2">
        </div>
    </div>
    <button class="btn" onclick="doDerivative()">求导</button>

    <div class="result-label" style="margin-top:1rem">导函数</div>
    <div class="result-box" id="result"></div>
    <div class="result-text" id="result_text"></div>

    <div id="xval_result_area" style="display:none">
        <div class="result-label" style="margin-top:1rem">导数值</div>
        <div class="result-box" id="xval_result"></div>
        <div class="result-text" id="xval_text"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('is_yin').addEventListener('change', e => {
    document.getElementById('yin_row').style.display = e.target.checked ? 'flex' : 'none';
});
document.getElementById('is_xval').addEventListener('change', e => {
    document.getElementById('xval_row').style.display = e.target.checked ? 'flex' : 'none';
    document.getElementById('xval_result_area').style.display = e.target.checked ? 'block' : 'none';
});

async function doDerivative() {
    const data = {
        expr: document.getElementById('expr').value,
        var: document.getElementById('var').value,
        n: document.getElementById('n').value,
        is_yin: document.getElementById('is_yin').checked,
        yin_var: document.getElementById('yin_var').value,
        is_xval: document.getElementById('is_xval').checked,
        x_val: document.getElementById('x_val').value
    };
    const r = await apiCall('/api/qiudao', data);
    if (r.ok) {
        renderMath('result', r.latex);
        showText('result_text', r.text);
        if (r.x_latex) {
            renderMath('xval_result', r.x_latex);
            showText('xval_text', r.x_text);
        }
    } else {
        showError('result', r.error);
    }
}
bindEnterKey('expr', 'btn');
</script>
{% endblock %}
