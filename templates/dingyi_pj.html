{% extends "base.html" %}
{% block title %}平面几何定义 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">平面几何对象定义</div>
    <div class="form-group">
        <label>名称</label>
        <input type="text" id="name" placeholder="如 P1">
    </div>
    <div class="form-group">
        <label>创建方法</label>
        <select id="method" onchange="onMethodChange()">
            <option value="0">未选择</option>
            <option value="1">创建点(x坐标,y坐标)</option>
            <option value="2">创建直线(点1名,点2名)</option>
            <option value="3">创建圆(圆心名,半径)</option>
            <option value="4">三点创建圆(点1,点2,点3)</option>
            <option value="5">创建三角形(点1,点2,点3)</option>
            <option value="6">创建多边形(点1,点2,…)</option>
            <option value="7">直径端点构造圆(点1,点2)</option>
            <option value="8">圆心+圆上点构造圆(圆心,点)</option>
            <option value="9">线段中垂线(线段名)</option>
            <option value="10">过点平行线(点名,线段名)</option>
            <option value="11">过点垂线(点名,线段名)</option>
            <option value="12">两直线角平分线(直线1,直线2)</option>
            <option value="13">角平分线(点1,顶点2,点3)</option>
            <option value="14">三角形中线(三角形名,顶点索引)</option>
            <option value="15">三角形高线(三角形名,顶点索引)</option>
            <option value="16">三角形中位线(三角形名)</option>
            <option value="17">三角形内切圆(三角形名)</option>
            <option value="18">三角形旁切圆(三角形名,顶点索引)</option>
            <option value="19">创建线段(点1,点2)</option>
        </select>
    </div>
    <div class="form-group">
        <label>参数 <span id="param_hint" style="color:var(--text-muted)"></span></label>
        <input type="text" id="params" placeholder="英文逗号分隔">
    </div>
    <button class="btn" onclick="createObject()">创建</button>
</div>

<div class="card">
    <div class="card-title">已定义对象</div>
    <div id="obj_lists">
        <div class="grid-3">
            <div>
                <label>点</label>
                <ul class="item-list" id="list_点"></ul>
            </div>
            <div>
                <label>直线</label>
                <ul class="item-list" id="list_直线"></ul>
            </div>
            <div>
                <label>线段</label>
                <ul class="item-list" id="list_线段"></ul>
            </div>
        </div>
        <div class="grid-2" style="margin-top:1rem">
            <div>
                <label>三角形/多边形</label>
                <ul class="item-list" id="list_三角形"></ul>
            </div>
            <div>
                <label>圆</label>
                <ul class="item-list" id="list_圆"></ul>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">对象属性</div>
    <div class="result-box" id="attr_box">点击列表中的对象查看属性</div>
</div>
{% endblock %}
{% block scripts %}
<script>
let pjs = {{ pjs | tojson }};

const hints = {
    0: "", 1: "x坐标, y坐标", 2: "点1名称, 点2名称",
    3: "圆心名称, 半径", 4: "点1名称, 点2名称, 点3名称",
    5: "点1名称, 点2名称, 点3名称", 6: "点1名称, 点2名称, ……",
    7: "点1名称, 点2名称", 8: "圆心名称, 圆上点名称",
    9: "线段名称", 10: "点名, 线段名", 11: "点名, 线段名",
    12: "直线1名称, 直线2名称", 13: "点1名称, 点2名称(顶点), 点3名称",
    14: "三角形名称, 顶点索引(0/1/2)", 15: "三角形名称, 顶点索引(0/1/2)",
    16: "三角形名称", 17: "三角形名称", 18: "三角形名称, 顶点索引(0/1/2)",
    19: "点1名称, 点2名称"
};

function onMethodChange() {
    const m = document.getElementById('method').value;
    document.getElementById('param_hint').textContent = hints[m] ? '(' + hints[m] + ')' : '';
}

function refreshLists() {
    const cats = ['点', '直线', '线段', '三角形', '圆'];
    cats.forEach(cat => {
        const list = document.getElementById('list_' + cat);
        list.innerHTML = '';
    });
    // 多边形归入三角形列表
    for (const name in pjs) {
        const cat = pjs[name].category;
        const targetCat = cat == '多边形' ? '三角形' : cat;
        const list = document.getElementById('list_' + targetCat);
        if (list) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${name}</span><button class="btn btn-sm btn-danger" onclick="deleteObj('${name}')">删除</button>`;
            li.onclick = () => showAttr(name);
            list.appendChild(li);
        }
    }
}

function showAttr(name) {
    const obj = pjs[name];
    if (!obj) return;
    document.getElementById('attr_box').textContent = `${name} [${obj.category}]: ${obj.equation}`;
}

async function createObject() {
    const r = await apiCall('/api/dingyi_pj/create', {
        method: document.getElementById('method').value,
        name: document.getElementById('name').value,
        params: document.getElementById('params').value
    });
    if (r.ok) { pjs = r.pjs; refreshLists(); }
    else alert(r.error);
}

async function deleteObj(name) {
    const r = await apiCall('/api/dingyi_pj/delete', { name });
    if (r.ok) { pjs = r.pjs; refreshLists(); }
}

refreshLists();
</script>
{% endblock %}
