{% extends "base.html" %}
{% block title %}立体绘图 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">立体几何绘图</div>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem">勾选要绘制的对象</p>
    <div class="checkbox-group" id="obj_checkboxes"></div>
    <button class="btn" onclick="draw()" style="margin-top:1rem">绘制</button>
    <div class="image-display" id="plot_result"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let ljs = {{ ljs | tojson }};

function refreshCheckboxes() {
    const container = document.getElementById('obj_checkboxes');
    container.innerHTML = '';
    for (const name in ljs) {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${name}" checked> [${ljs[name].category}] ${name}`;
        container.appendChild(label);
    }
}

async function draw() {
    const checked = Array.from(document.querySelectorAll('#obj_checkboxes input:checked')).map(i => i.value);
    if (!checked.length) { alert('请至少选择一个对象'); return; }
    const r = await apiCall('/api/huitu_lj', { checked });
    if (r.ok) showImage('plot_result', r.image);
    else showError('plot_result', r.error);
}

refreshCheckboxes();
</script>
{% endblock %}
