{% extends "base.html" %}
{% block title %}方程组 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">方程组求解</div>
    <div class="grid-2">
        <div>
            <div class="form-row">
                <div class="form-group">
                    <label>左式</label>
                    <input type="text" id="lhs" placeholder="如 x + y">
                </div>
                <div class="form-group">
                    <label>右式</label>
                    <input type="text" id="rhs" placeholder="如 3">
                </div>
            </div>
            <button class="btn btn-sm" onclick="saveEquation()">添加方程</button>
            <button class="btn btn-sm btn-danger" onclick="deleteEquation()">删除选中</button>
        </div>
        <div>
            <label>方程列表</label>
            <ul class="item-list" id="eq_list">
                {% for eq in eqs %}
                <li onclick="selectEquation(this)" data-key="{{ eq }}"><span>{{ eq }}</span></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">求解</div>
    <div class="form-group">
        <label>自由变量（逗号分隔）</label>
        <input type="text" id="vars" placeholder="如 x,y">
    </div>
    <button class="btn" onclick="solveSystem()">求解方程组</button>
    <div class="result-label" style="margin-top:1rem">求解结果</div>
    <div class="result-box" id="result"></div>
    <div class="result-text" id="result_text"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let selectedEq = null;

function selectEquation(li) {
    selectedEq = li.dataset.key;
    const items = document.querySelectorAll('#eq_list li');
    items.forEach(i => i.style.background = '');
    li.style.background = '#dbeafe';
    const parts = selectedEq.split('=');
    if (parts.length >= 2) {
        document.getElementById('lhs').value = parts[0].trim();
        document.getElementById('rhs').value = parts.slice(1).join('=').trim();
    }
}

async function saveEquation() {
    const r = await apiCall('/api/fangchengzu/save', {
        lhs: document.getElementById('lhs').value,
        rhs: document.getElementById('rhs').value
    });
    if (r.ok) refreshEqList(r.eqs);
    else alert(r.error);
}

async function deleteEquation() {
    if (!selectedEq) { alert('请先选择方程'); return; }
    const r = await apiCall('/api/fangchengzu/delete', { key: selectedEq });
    if (r.ok) { refreshEqList(r.eqs); selectedEq = null; }
}

function refreshEqList(eqs) {
    const list = document.getElementById('eq_list');
    list.innerHTML = '';
    eqs.forEach(eq => {
        const li = document.createElement('li');
        li.dataset.key = eq;
        li.innerHTML = `<span>${eq}</span>`;
        li.onclick = () => selectEquation(li);
        list.appendChild(li);
    });
}

async function solveSystem() {
    const r = await apiCall('/api/fangchengzu/solve', {
        vars: document.getElementById('vars').value
    });
    if (r.ok) {
        renderMath('result', r.latex);
        showText('result_text', r.text);
    } else {
        showError('result', r.error);
    }
}
</script>
{% endblock %}
