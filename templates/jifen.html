{% extends "base.html" %}
{% block title %}积分 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">积分</div>
    <div class="form-group">
        <label>被积函数表达式</label>
        <input type="text" id="expr" placeholder="如 x**2">
    </div>
    <div class="form-group">
        <label>积分变量</label>
        <input type="text" id="var" value="x">
    </div>
    <div class="checkbox-group" style="margin-bottom:1rem">
        <label><input type="checkbox" id="is_ding"> 定积分</label>
    </div>
    <div class="form-row" id="ding_row" style="display:none">
        <div class="form-group">
            <label>下限</label>
            <input type="text" id="a" placeholder="如 0">
        </div>
        <div class="form-group">
            <label>上限</label>
            <input type="text" id="b" placeholder="如 1">
        </div>
    </div>
    <button class="btn" onclick="doIntegral()">积分</button>

    <div id="indef_area">
        <div class="result-label" style="margin-top:1rem">不定积分结果</div>
        <div class="result-box" id="indef_result"></div>
        <div class="result-text" id="indef_text"></div>
    </div>
    <div id="def_area" style="display:none">
        <div class="result-label" style="margin-top:1rem">定积分结果</div>
        <div class="result-box" id="def_result"></div>
        <div class="result-text" id="def_text"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('is_ding').addEventListener('change', e => {
    document.getElementById('ding_row').style.display = e.target.checked ? 'flex' : 'none';
    document.getElementById('def_area').style.display = e.target.checked ? 'block' : 'none';
});

async function doIntegral() {
    const data = {
        expr: document.getElementById('expr').value,
        var: document.getElementById('var').value,
        is_ding: document.getElementById('is_ding').checked,
        a: document.getElementById('a').value,
        b: document.getElementById('b').value
    };
    const r = await apiCall('/api/jifen', data);
    if (r.ok) {
        if (data.is_ding) {
            renderMath('def_result', r.latex);
            showText('def_text', r.text);
            renderMath('indef_result', r.indef_latex);
            showText('indef_text', r.indef_text);
        } else {
            renderMath('indef_result', r.latex);
            showText('indef_text', r.text);
        }
    } else {
        showError('indef_result', r.error);
    }
}
</script>
{% endblock %}
