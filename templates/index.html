<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微积分计算器 (Web)</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- MathLive 公式编辑器（页面底部虚拟键盘） -->
  <link rel="stylesheet" href="/static/mathlive/mathlive-fonts.css">
  <link rel="stylesheet" href="/static/mathlive/mathlive-static.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script src="/static/mathjax.js" id="MathJax-script" async></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo">∫</span>
        <span class="brand-text" data-i18n="appTitle">微积分计算器</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span data-i18n="webVersion">Web 版本 · Python 计算内核</span>
        <div class="side-links">
          <a href="https://github.com/limingkang12345/CalculusCalculator" target="_blank" rel="noopener">GitHub</a>
          <a href="https://limingkang12345.github.io/CalculusCalculator/" target="_blank" rel="noopener">文档</a>
          <a href="https://pypi.org/project/CalculusCalculator/" target="_blank" rel="noopener">PyPI</a>
        </div>
      </div>
    </aside>
    <main id="main">
      <div id="toolbar">
        <button id="menuBtn" class="tool-btn" title="菜单">☰</button>
        <div class="toolbar-links">
          <a href="https://github.com/limingkang12345/CalculusCalculator" target="_blank" rel="noopener" title="GitHub"><span class="link-ico">GH</span></a>
          <a href="https://limingkang12345.github.io/CalculusCalculator/" target="_blank" rel="noopener" title="在线文档"><span class="link-ico">DOC</span></a>
          <a href="https://pypi.org/project/CalculusCalculator/" target="_blank" rel="noopener" title="PyPI"><span class="link-ico">Py</span></a>
        </div>
        <button id="themeBtn" class="tool-btn" title="切换主题">🌙</button>
        <button id="langBtn" class="tool-btn">EN</button>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <!-- 公式预览浮层：点击输入框时在其上方浮现 -->
  <div id="preview-pop" hidden>
    <div id="preview-pop-body"></div>
  </div>

  <!-- MathLive 虚拟键盘（固定在页面底部，类似软键盘） -->
  <div id="mathkb" hidden>
    <div class="mathkb-head">
      <span id="mathkb-title">公式输入</span>
      <span class="mathkb-actions">
        <button class="ghost small" id="mathkbClear">清空</button>
        <button class="primary small" id="mathkbInsert">插入</button>
        <button class="ghost small" id="mathkbClose">收起</button>
      </span>
    </div>
    <math-field id="mf" locale="zh-CN"
                placeholder="在此输入公式，例如 x^2 + y^2 = 1"></math-field>
    <div class="mathkb-foot">
      <span>LaTeX：</span><code id="mathkbLatex">（空）</code>
    </div>
  </div>

  <!-- 紧贴 MathLive 虚拟键盘顶部的"收起"按钮（键盘出现时才显示） -->
  <button id="kbCollapse" class="ghost" type="button" hidden>收起键盘</button>

  <div id="toast"></div>
  <script src="/static/mathlive/mathlive.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
