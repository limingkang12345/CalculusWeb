<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微积分计算器 v1.2</title>
    <!-- MathJax CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/latest.js?config=TeX-MML-AM_CHTML"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 标签页头 -->
        <div class="tabs">
            <button class="tab-button active" data-tab="home">首页</button>
            <button class="tab-button" data-tab="derivative">求导</button>
            <button class="tab-button" data-tab="integral">积分</button>
            <button class="tab-button" data-tab="simplify">变形</button>
            <button class="tab-button" data-tab="equation">方程</button>
            <button class="tab-button" data-tab="inequality">不等式</button>
            <button class="tab-button" data-tab="help">帮助</button>
        </div>

        <!-- 首页内容 -->
        <div id="home" class="tab-content active">
            <div class="welcome">
                <h1>欢迎使用微积分计算器v1.2！</h1>
                <p>Author: Li Mingkang</p>
                <p>Contributor: CuberAHZ</p>
            </div>
        </div>

        <!-- 求导标签页（与之前相同，略作调整） -->
        <div id="derivative" class="tab-content">
            <div class="section">
                <div class="group-box">
                    <div class="group-title">输入表达式</div>
                    <input type="text" id="derivative-expr" placeholder="例如: x**2 + sin(x)" value="x**2">
                </div>
                <div class="params-row">
                    <div class="group-box small">
                        <div class="group-title">自变量</div>
                        <input type="text" id="derivative-var" value="x">
                    </div>
                    <div class="group-box small">
                        <div class="group-title">因变量(仅隐函数)</div>
                        <input type="text" id="derivative-yvar" value="y" disabled>
                    </div>
                    <div class="group-box small">
                        <div class="group-title">求导次数</div>
                        <input type="text" id="derivative-order" value="1">
                    </div>
                    <div class="group-box small">
                        <div class="group-title">自变量值</div>
                        <input type="text" id="derivative-xval" value="" disabled>
                    </div>
                </div>
                <div class="checkbox-row">
                    <label>
                        <input type="checkbox" id="derivative-implicit"> 隐函数
                    </label>
                    <label>
                        <input type="checkbox" id="derivative-specific"> 求出具体值
                    </label>
                </div>
                <div class="group-box">
                    <div class="group-title">原函数</div>
                    <div id="derivative-original" class="math-output">\\(f(x)= \\)</div>
                </div>
                <div class="group-box">
                    <div class="group-title">导函数</div>
                    <div id="derivative-result" class="math-output">\\(f'(x)= \\)</div>
                </div>
                <div class="group-box">
                    <div class="group-title">导数值</div>
                    <div id="derivative-value" class="math-output"></div>
                </div>
                <button id="derivative-btn" class="action-btn">求导</button>
            </div>
        </div>

        <!-- 积分标签页（与之前相同） -->
        <div id="integral" class="tab-content">
            <div class="section">
                <div class="group-box">
                    <div class="group-title">输入表达式</div>
                    <input type="text" id="integral-expr" placeholder="例如: x**2" value="x**2">
                </div>
                <div class="params-row">
                    <div class="group-box small">
                        <div class="group-title">积分变量</div>
                        <input type="text" id="integral-var" value="x">
                    </div>
                    <div class="group-box small">
                        <div class="group-title">下限值</div>
                        <input type="text" id="integral-lower" value="" disabled>
                    </div>
                    <div class="group-box small">
                        <div class="group-title">上限值</div>
                        <input type="text" id="integral-upper" value="" disabled>
                    </div>
                </div>
                <div class="checkbox-row">
                    <label>
                        <input type="checkbox" id="integral-definite"> 定积分
                    </label>
                </div>
                <div class="group-box">
                    <div class="group-title">被积函数</div>
                    <div id="integral-original" class="math-output">\\(f(x)= \\)</div>
                </div>
                <div class="group-box">
                    <div class="group-title">原函数</div>
                    <div id="integral-antiderivative" class="math-output">\\(F(x)= \\)</div>
                </div>
                <div class="group-box">
                    <div class="group-title">定积分值</div>
                    <div id="integral-definite-value" class="math-output"></div>
                </div>
                <button id="integral-btn" class="action-btn">积分</button>
            </div>
        </div>

        <!-- 变形标签页（新增选项区域，支持主元/换元） -->
        <div id="simplify" class="tab-content">
            <div class="section">
                <div class="group-box">
                    <div class="group-title">输入表达式</div>
                    <input type="text" id="simplify-expr" placeholder="例如: (x+1)**2" value="(x+1)**2">
                </div>
                <div class="group-box">
                    <div class="group-title">变形方法</div>
                    <select id="simplify-method">
                        <option value="0">通用化简(simplify)</option>
                        <option value="1">展开(expand)</option>
                        <option value="2">因式分解(factor)</option>
                        <option value="3">主元(collect)</option>
                        <option value="4">通分(cancel)</option>
                        <option value="5">分离(apart)</option>
                        <option value="6">三角变换(trigsimp)</option>
                        <option value="7">三角展开(expand_trig)</option>
                        <option value="8">指数合并(powsimp)</option>
                        <option value="9">指数展开(expand_power_exp)</option>
                        <option value="10">对数展开(expand_log)</option>
                        <option value="11">对数合并(logcombine)</option>
                        <option value="12">换元</option>
                    </select>
                </div>
                <!-- 选项区域 -->
                <div class="group-box" id="simplify-options">
                    <div class="group-title">选项</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                        <span>主元符号：</span>
                        <input type="text" id="simplify-zhuyuan" value="x" style="width:50px;" disabled>
                        <span>换元符号：</span>
                        <input type="text" id="simplify-huanyuan" value="t" style="width:50px;" disabled>
                        <span>=</span>
                        <input type="text" id="simplify-huanyuanshi" value="x+1" style="width:200px;" disabled>
                    </div>
                </div>
                <div class="group-box">
                    <div class="group-title">原式</div>
                    <div id="simplify-original" class="math-output">\\( \\)</div>
                </div>
                <div class="group-box">
                    <div class="group-title">变形式</div>
                    <div id="simplify-result" class="math-output">\\( \\)</div>
                    <input type="text" id="simplify-result-text" readonly placeholder="变形结果字符串形式">
                </div>
                <button id="simplify-btn" class="action-btn">变形</button>
            </div>
        </div>

        <!-- 方程标签页 -->
        <div id="equation" class="tab-content">
            <div class="section">
                <div class="group-box">
                    <div class="group-title">输入方程</div>
                    <input type="text" id="equation-lhs" placeholder="左边表达式" value="x**2">
                    <div style="margin:5px 0;">=</div>
                    <input type="text" id="equation-rhs" placeholder="右边表达式" value="0">
                </div>
                <div class="params-row">
                    <div class="group-box small">
                        <div class="group-title">主元符号</div>
                        <input type="text" id="equation-var" value="x">
                    </div>
                    <div class="group-box small" style="flex:2;">
                        <div class="group-title">主元取值范围</div>
                        <input type="text" id="equation-domain" value="Reals">
                    </div>
                </div>
                <div class="group-box">
                    <div class="group-title">原方程</div>
                    <div id="equation-original" class="math-output"></div>
                </div>
                <div class="group-box">
                    <div class="group-title">解集</div>
                    <div id="equation-solution" class="math-output"></div>
                    <input type="text" id="equation-solution-text" readonly placeholder="解集字符串形式">
                </div>
                <button id="equation-btn" class="action-btn">求解</button>
            </div>
        </div>

        <!-- 不等式标签页 -->
        <div id="inequality" class="tab-content">
            <div class="section">
                <div class="group-box">
                    <div class="group-title">输入不等式</div>
                    <input type="text" id="inequality-lhs" placeholder="左边表达式" value="x**2">
                    <div style="display: flex; margin:5px 0; align-items: center;">
                        <select id="inequality-rel" style="width:80px; margin-right:10px;">
                            <option value="!=">!=</option>
                            <option value=">">&gt;</option>
                            <option value=">=">&gt;=</option>
                            <option value="<">&lt;</option>
                            <option value="<=">&lt;=</option>
                        </select>
                        <input type="text" id="inequality-rhs" placeholder="右边表达式" value="0" style="flex:1;">
                    </div>
                </div>
                <div class="params-row">
                    <div class="group-box small">
                        <div class="group-title">主元符号</div>
                        <input type="text" id="inequality-var" value="x">
                    </div>
                    <div class="group-box small" style="flex:2;">
                        <div class="group-title">主元取值范围</div>
                        <input type="text" id="inequality-domain" value="Reals">
                    </div>
                </div>
                <div class="group-box">
                    <div class="group-title">原不等式</div>
                    <div id="inequality-original" class="math-output"></div>
                </div>
                <div class="group-box">
                    <div class="group-title">解集</div>
                    <div id="inequality-solution" class="math-output"></div>
                    <input type="text" id="inequality-solution-text" readonly placeholder="解集字符串形式">
                </div>
                <button id="inequality-btn" class="action-btn">求解</button>
            </div>
        </div>

        <!-- 帮助标签页：直接嵌入 iframe 显示 help.html -->
        <div id="help" class="tab-content">
            <iframe src="/static/help.html" style="width:100%; height:550px; border:none;"></iframe>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
