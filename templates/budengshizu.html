{% extends "base.html" %}
{% block title %}不等式组 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">不等式组求解</div>
    <div class="grid-2">
        <div>
            <div class="form-row">
                <div class="form-group">
                    <label>左式</label>
                    <input type="text" id="lhs" placeholder="如 x + 1">
                </div>
                <div class="form-group" style="max-width:100px">
                    <label>不等号</label>
                    <select id="op">
                        <option value="!=">!=</option>
                        <option value=">">&gt;</option>
                        <option value=">=">&gt;=</option>
                        <option value="<">&lt;</option>
                        <option value="<=">&lt;=</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>右式</label>
                    <input type="text" id="rhs" placeholder="如 5">
                </div>
            </div>
            <button class="btn btn-sm" onclick="saveInequality()">添加不等式</button>
            <button class="btn btn-sm btn-danger" onclick="deleteInequality()">删除选中</button>
        </div>
        <div>
            <label>不等式列表</label>
            <ul class="item-list" id="rel_list">
                {% for rel in rels %}
                <li onclick="selectInequality(this)" data-key="{{ rel }}"><span>{{ rel }}</span></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">求解</div>
    <div class="form-group">
        <label>自由变量</label>
        <input type="text" id="var" value="x">
    </div>
    <button class="btn" onclick="solveSystem()">求解不等式组</button>
    <div class="result-label" style="margin-top:1rem">求解结果</div>
    <div class="result-box" id="result"></div>
    <div class="result-text" id="result_text"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let selectedRel = null;

function selectInequality(li) {
    selectedRel = li.dataset.key;
    const items = document.querySelectorAll('#rel_list li');
    items.forEach(i => i.style.background = '');
    li.style.background = '#dbeafe';
    const parts = li.querySelector('span').textContent;
    const ops = ['>=', '<=', '!=', '>', '<'];
    for (const op of ops) {
        if (parts.includes(op)) {
            const idx = parts.indexOf(op);
            document.getElementById('lhs').value = parts.substring(0, idx).trim();
            document.getElementById('rhs').value = parts.substring(idx + op.length).trim();
            document.getElementById('op').value = op;
            break;
        }
    }
}

async function saveInequality() {
    const r = await apiCall('/api/budengshizu/save', {
        lhs: document.getElementById('lhs').value,
        rhs: document.getElementById('rhs').value,
        op: document.getElementById('op').value
    });
    if (r.ok) refreshRelList(r.rels);
    else alert(r.error);
}

async function deleteInequality() {
    if (!selectedRel) { alert('请先选择不等式'); return; }
    const r = await apiCall('/api/budengshizu/delete', { key: selectedRel });
    if (r.ok) { refreshRelList(r.rels); selectedRel = null; }
}

function refreshRelList(rels) {
    const list = document.getElementById('rel_list');
    list.innerHTML = '';
    rels.forEach(rel => {
        const li = document.createElement('li');
        li.dataset.key = rel;
        li.innerHTML = `<span>${rel}</span>`;
        li.onclick = () => selectInequality(li);
        list.appendChild(li);
    });
}

async function solveSystem() {
    const r = await apiCall('/api/budengshizu/solve', {
        var: document.getElementById('var').value
    });
    if (r.ok) {
        renderMath('result', r.latex);
        showText('result_text', r.text);
    } else {
        showError('result', r.error);
    }
}
</script>
{% endblock %}
