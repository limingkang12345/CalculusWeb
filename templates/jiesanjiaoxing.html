{% extends "base.html" %}
{% block title %}解三角形 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">解三角形</div>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem">请填写恰好3个条件（角度A/B/C 或 边a/b/c）</p>
    <div id="conditions">
        <div class="form-row condition-row">
            <div class="form-group" style="max-width:120px">
                <label>条件1</label>
                <select class="cond-type">
                    <option value="0">不选择</option>
                    <option value="1">角A</option>
                    <option value="2">角B</option>
                    <option value="3">角C</option>
                    <option value="4">边a</option>
                    <option value="5">边b</option>
                    <option value="6">边c</option>
                </select>
            </div>
            <div class="form-group">
                <label>值</label>
                <input type="text" class="cond-val" placeholder="如 60 或 pi/3">
            </div>
        </div>
        <div class="form-row condition-row">
            <div class="form-group" style="max-width:120px">
                <label>条件2</label>
                <select class="cond-type">
                    <option value="0">不选择</option>
                    <option value="1">角A</option>
                    <option value="2">角B</option>
                    <option value="3">角C</option>
                    <option value="4">边a</option>
                    <option value="5">边b</option>
                    <option value="6">边c</option>
                </select>
            </div>
            <div class="form-group">
                <label>值</label>
                <input type="text" class="cond-val" placeholder="如 60 或 pi/3">
            </div>
        </div>
        <div class="form-row condition-row">
            <div class="form-group" style="max-width:120px">
                <label>条件3</label>
                <select class="cond-type">
                    <option value="0">不选择</option>
                    <option value="1">角A</option>
                    <option value="2">角B</option>
                    <option value="3">角C</option>
                    <option value="4">边a</option>
                    <option value="5">边b</option>
                    <option value="6">边c</option>
                </select>
            </div>
            <div class="form-group">
                <label>值</label>
                <input type="text" class="cond-val" placeholder="如 60 或 pi/3">
            </div>
        </div>
    </div>
    <button class="btn" onclick="solveTriangle()">求解</button>

    <div class="result-label" style="margin-top:1rem">原条件</div>
    <div class="result-box" id="cond_result"></div>
    <div class="result-label" style="margin-top:1rem">求解结果</div>
    <div class="result-box" id="result"></div>
    <div class="result-text" id="result_text"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function solveTriangle() {
    const rows = document.querySelectorAll('.condition-row');
    const conditions = [];
    rows.forEach(row => {
        conditions.push({
            type: parseInt(row.querySelector('.cond-type').value),
            value: row.querySelector('.cond-val').value
        });
    });
    const r = await apiCall('/api/jiesanjiaoxing', { conditions });
    if (r.ok) {
        renderMath('cond_result', r.condition_latex);
        renderMath('result', r.result_latex);
        showText('result_text', r.text);
    } else {
        showError('result', r.error);
    }
}
</script>
{% endblock %}
