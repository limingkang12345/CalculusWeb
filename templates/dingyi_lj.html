{% extends "base.html" %}
{% block title %}立体几何定义 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">立体几何对象定义</div>
    <div class="form-group">
        <label>名称</label>
        <input type="text" id="name" placeholder="如 A">
    </div>
    <div class="form-group">
        <label>创建方法</label>
        <select id="method" onchange="onMethodChange()">
            <option value="0">未选择</option>
            <option value="1">创建点(x,y,z)</option>
            <option value="2">创建直线(点1,点2)</option>
            <option value="3">过点平行平面(平面,点)</option>
            <option value="4">过点垂直于直线的平面(直线,点)</option>
            <option value="5">过点平行直线(直线,点)</option>
            <option value="6">过点垂线(点,直线)</option>
            <option value="7">过点垂直于平面的直线(平面,点)</option>
            <option value="8">过直线和点作平面(直线,点)</option>
            <option value="9">过两直线作平面(直线1,直线2)</option>
            <option value="10">点到平面垂足(点,平面)</option>
            <option value="11">点到直线垂足(点,直线)</option>
            <option value="12">创建线段(点1,点2)</option>
        </select>
    </div>
    <div class="form-group">
        <label>参数 <span id="param_hint" style="color:var(--text-muted)"></span></label>
        <input type="text" id="params" placeholder="英文逗号分隔">
    </div>
    <button class="btn" onclick="createObject()">创建</button>
</div>

<div class="card">
    <div class="card-title">已定义对象</div>
    <div class="grid-2">
        <div>
            <label>点</label>
            <ul class="item-list" id="list_点"></ul>
        </div>
        <div>
            <label>直线</label>
            <ul class="item-list" id="list_直线"></ul>
        </div>
    </div>
    <div class="grid-2" style="margin-top:1rem">
        <div>
            <label>平面</label>
            <ul class="item-list" id="list_平面"></ul>
        </div>
        <div>
            <label>线段</label>
            <ul class="item-list" id="list_线段"></ul>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">对象属性</div>
    <div class="result-box" id="attr_box">点击列表中的对象查看属性</div>
</div>
{% endblock %}
{% block scripts %}
<script>
let ljs = {{ ljs | tojson }};
const hints = {
    0:"",1:"x坐标, y坐标, z坐标",2:"点1名称, 点2名称",
    3:"平面名称, 点名称",4:"直线名称, 点名称",5:"直线名称, 点名称",
    6:"点名称, 直线名称",7:"平面名称, 点名称",8:"直线名称, 点名称",
    9:"直线1名称, 直线2名称",10:"点名称, 平面名称",11:"点名称, 直线名称",
    12:"点1名称, 点2名称"
};

function onMethodChange() {
    const m = document.getElementById('method').value;
    document.getElementById('param_hint').textContent = hints[m] ? '(' + hints[m] + ')' : '';
}

function refreshLists() {
    ['点','直线','平面','线段'].forEach(cat => {
        document.getElementById('list_' + cat).innerHTML = '';
    });
    for (const name in ljs) {
        const cat = ljs[name].category;
        const list = document.getElementById('list_' + cat);
        if (list) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${name}</span><button class="btn btn-sm btn-danger" onclick="deleteObj('${name}')">删除</button>`;
            li.onclick = () => showAttr(name);
            list.appendChild(li);
        }
    }
}

function showAttr(name) {
    const obj = ljs[name];
    if (!obj) return;
    document.getElementById('attr_box').textContent = `${name} [${obj.category}]: ${obj.equation}`;
}

async function createObject() {
    const r = await apiCall('/api/dingyi_lj/create', {
        method: document.getElementById('method').value,
        name: document.getElementById('name').value,
        params: document.getElementById('params').value
    });
    if (r.ok) { ljs = r.ljs; refreshLists(); }
    else alert(r.error);
}

async function deleteObj(name) {
    const r = await apiCall('/api/dingyi_lj/delete', { name });
    if (r.ok) { ljs = r.ljs; refreshLists(); }
}

refreshLists();
</script>
{% endblock %}
