{% extends "base.html" %}
{% block title %}向量运算 - CalculusCalculator{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title">定义向量</div>
    <div class="grid-2">
        <div>
            <div class="form-row">
                <div class="form-group">
                    <label>向量名</label>
                    <input type="text" id="vec_name" placeholder="如 v1">
                </div>
                <div class="form-group">
                    <label>x分量</label>
                    <input type="text" id="vec_x" placeholder="如 3">
                </div>
                <div class="form-group">
                    <label>y分量</label>
                    <input type="text" id="vec_y" placeholder="如 4">
                </div>
            </div>
            <button class="btn btn-sm" onclick="saveVector()">保存</button>
            <button class="btn btn-sm btn-danger" onclick="deleteVector()">删除</button>
        </div>
        <div>
            <label>向量列表</label>
            <ul class="item-list" id="vec_list">
                {% for name, v in vs.items() %}
                <li onclick="loadVector('{{ name }}')" data-name="{{ name }}"><span>{{ name }}=({{ v[1] }}, {{ v[2] }})</span></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">向量属性</div>
    <div class="form-row">
        <div class="form-group">
            <label>属性类型</label>
            <select id="attr_type">
                <option value="0">表达式</option>
                <option value="1">模</option>
                <option value="2">方向角</option>
                <option value="3">单位向量</option>
            </select>
        </div>
    </div>
    <button class="btn" onclick="computeAttr()">计算属性</button>
    <div class="result-box" id="attr_result" style="margin-top:1rem"></div>
    <div class="result-text" id="attr_text"></div>
</div>

<div class="card">
    <div class="card-title">向量运算</div>
    <div class="form-row">
        <div class="form-group">
            <label>向量1</label>
            <select id="v1"></select>
        </div>
        <div class="form-group">
            <label>运算</label>
            <select id="method">
                <option value="0">加法</option>
                <option value="1">减法</option>
                <option value="2">点积</option>
                <option value="3">夹角</option>
            </select>
        </div>
        <div class="form-group">
            <label>向量2</label>
            <select id="v2"></select>
        </div>
    </div>
    <button class="btn" onclick="computeVector()">计算</button>
    <div class="result-box" id="compute_result" style="margin-top:1rem"></div>
    <div class="result-text" id="compute_text"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let vs = {{ state.get('vs', {}) | tojson }};

function refreshLists() {
    const vl = document.getElementById('vec_list');
    vl.innerHTML = '';
    const names = Object.keys(vs);
    ['v1', 'v2'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        names.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n; opt.textContent = n;
            sel.appendChild(opt);
        });
    });
    for (const name in vs) {
        const li = document.createElement('li');
        li.dataset.name = name;
        li.innerHTML = `<span>${name}=(${vs[name][1]}, ${vs[name][2]})</span>`;
        li.onclick = () => loadVector(name);
        vl.appendChild(li);
    }
}

function loadVector(name) {
    const v = vs[name];
    if (!v) return;
    document.getElementById('vec_name').value = v[0];
    document.getElementById('vec_x').value = v[1];
    document.getElementById('vec_y').value = v[2];
}

async function saveVector() {
    const r = await apiCall('/api/xiangliang/save', {
        name: document.getElementById('vec_name').value,
        x: document.getElementById('vec_x').value,
        y: document.getElementById('vec_y').value
    });
    if (r.ok) { vs = r.vs; refreshLists(); }
    else alert(r.error);
}

async function deleteVector() {
    const r = await apiCall('/api/xiangliang/delete', {
        name: document.getElementById('vec_name').value
    });
    if (r.ok) { vs = r.vs; refreshLists(); }
}

async function computeAttr() {
    const r = await apiCall('/api/xiangliang/attr', {
        name: document.getElementById('vec_name').value,
        x: document.getElementById('vec_x').value,
        y: document.getElementById('vec_y').value,
        attr: document.getElementById('attr_type').value
    });
    if (r.ok) { renderMath('attr_result', r.latex); showText('attr_text', r.text); }
    else showError('attr_result', r.error);
}

async function computeVector() {
    const r = await apiCall('/api/xiangliang/compute', {
        v1: document.getElementById('v1').value,
        v2: document.getElementById('v2').value,
        method: document.getElementById('method').value
    });
    if (r.ok) { renderMath('compute_result', r.latex); showText('compute_text', r.text); }
    else showError('compute_result', r.error);
}

refreshLists();
</script>
{% endblock %}
