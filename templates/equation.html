{% extends "base.html" %}
{% block content %}
{% set active_page = 'equation' %}

<div class="page-header">
    <h2>✕ 方程求解</h2>
    <p>求解代数方程或微分方程（ODE）</p>
</div>

<form method="POST" class="card">
    <div class="card-header">📝 方程设置</div>
    <div class="card-body">
        <div class="form-row">
            <div class="form-group">
                <label>左式</label>
                <input type="text" name="lhs" id="eqLhs" placeholder="例如: x**2" value="{{ request.form.get('lhs', '') }}" required>
            </div>
            <div class="form-group">
                <label>右式</label>
                <input type="text" name="rhs" id="eqRhs" placeholder="例如: 1" value="{{ request.form.get('rhs', '0') }}">
            </div>
        </div>
        <div id="eqPreview" style="margin-top:6px;min-height:30px;"></div>
        <div class="form-row">
            <div class="form-group">
                <label>主元符号</label>
                <input type="text" name="var" id="eqVar" value="{{ request.form.get('var', 'x') }}">
            </div>
            <div class="form-group">
                <label>取值范围</label>
                <input type="text" name="domain" id="eqDomain" value="{{ request.form.get('domain', 'Reals') }}">
            </div>
        </div>
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_ode" onchange="toggleODE()" {% if request.form.get('is_ode') == 'on' %}checked{% endif %}>
                微分方程 ODE
            </label>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">🧮 求解</button>
        </div>
    </div>
</form>

{% if result %}
<div class="card result-card">
    <div class="card-header">📊 解集</div>
    <div class="card-body">
        <div class="result-display">
            <div style="font-size:20px;">\({{ result_latex | safe }}\)</div>
        </div>
        <div class="result-text">{{ result }}</div>
    </div>
</div>
{% endif %}

<script>
    function toggleODE() {
        const cb = document.querySelector('[name="is_ode"]');
        const varField = document.getElementById('eqVar');
        const domainField = document.getElementById('eqDomain');
        if (cb.checked) {
            varField.value = 'f(x)';
            varField.disabled = true;
            domainField.value = '';
            domainField.disabled = true;
        } else {
            varField.value = 'x';
            varField.disabled = false;
            domainField.value = 'Reals';
            domainField.disabled = false;
        }
    }
    document.addEventListener('DOMContentLoaded', toggleODE);

    // 实时预览方程
    function updateEqPreview() {
        const lhs = document.getElementById('eqLhs').value;
        const rhs = document.getElementById('eqRhs').value;
        const preview = document.getElementById('eqPreview');
        if (lhs.trim()) {
            Promise.all([
                fetch('{{ url_for("api_render") }}?expr=' + encodeURIComponent(lhs)).then(r => r.json()),
                fetch('{{ url_for("api_render") }}?expr=' + encodeURIComponent(rhs || '0')).then(r => r.json())
            ]).then(([l, r]) => {
                if (l.success && r.success) {
                    preview.innerHTML = '\\(' + l.latex + ' = ' + r.latex + '\\)';
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([preview]);
                    }
                }
            }).catch(() => {});
        } else {
            preview.innerHTML = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('eqLhs').addEventListener('input', updateEqPreview);
        document.getElementById('eqRhs').addEventListener('input', updateEqPreview);
    });
</script>
{% endblock %}
